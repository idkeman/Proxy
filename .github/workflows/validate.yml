name: Validate Proxy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/app.js
          node --check public/search.js
          node --check public/register-sw.js
          node --check public/uv/uv.config.js
      - name: Validate root frontend inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim());
          if (scripts.length !== 1) {
            throw new Error('Expected exactly one inline frontend script, found ' + scripts.length);
          }
          new Function(scripts[0]);
          console.log('Root frontend inline JavaScript parses successfully.');
          NODE
      - name: Test frontend routing behavior
        run: node tests/frontend.test.js
      - name: Smoke test the deployed backend
        run: |
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail https://idkeman-proxy-ryuq.onrender.com/healthz > /tmp/proxy-live-health.json; then
              break
            fi
            sleep 5
          done
          grep -q '"status":"ok"' /tmp/proxy-live-health.json
          curl --silent --show-error --fail https://idkeman-proxy-ryuq.onrender.com/uv/uv.bundle.js > /dev/null
          curl --silent --show-error --fail https://idkeman-proxy-ryuq.onrender.com/epoxy/index.mjs > /dev/null
          curl --silent --show-error --fail https://idkeman-proxy-ryuq.onrender.com/baremux/worker.js > /dev/null
      - name: Smoke test the server
        run: |
          npm start > /tmp/proxy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/healthz > /tmp/proxy-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/proxy-health.json
          curl --silent --fail http://127.0.0.1:8080/ | grep -qi 'PROXY'
          curl --silent --fail http://127.0.0.1:8080/uv/uv.bundle.js > /dev/null
          curl --silent --fail http://127.0.0.1:8080/baremux/index.js > /dev/null
          curl --silent --fail http://127.0.0.1:8080/epoxy/index.mjs > /dev/null
