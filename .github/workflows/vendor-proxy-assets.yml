name: Build static proxy assets

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/install-static-assets.mjs"
      - ".github/workflows/vendor-proxy-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node scripts/install-static-assets.mjs
      - name: Commit generated browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/uv public/baremux public/epoxy
          if git diff --cached --quiet; then
            echo "Static assets are already up to date."
            exit 0
          fi
          git commit -m "Vendor static Ultraviolet proxy assets"
          git push origin main
